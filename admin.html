<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Freshers' Night</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090711;color:#f8f5f1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
h1{margin:0 0 16px;font-size:24px}
.card{max-width:1200px;margin:0 auto}
input,button{font:inherit;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#171026;color:#fff;padding:12px 14px}
button{cursor:pointer;background:#ff2f92;border-color:transparent;font-weight:700}
button.ghost{background:transparent;border-color:rgba(255,255,255,.25)}
button.tab{background:transparent;border-color:rgba(255,255,255,.2);color:#cfc7d4}
button.tab.on{background:#ff2f92;border-color:transparent;color:#fff}
button.small{padding:6px 10px;font-size:13px}
button.del{background:transparent;border:1px solid #ff5a7a;color:#ff5a7a}
button.ok{background:#19d8cf;color:#062a28}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row input{flex:1;min-width:180px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{padding:10px 14px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.05)}
.stat b{font-size:20px;margin-right:6px}
.wrap{overflow-x:auto;border:1px solid rgba(255,255,255,.12);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top;font-size:14px}
th{color:#b7afbd;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.msg{color:#ff8fb5;min-height:22px;margin:8px 0}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.badge.v{background:#19d8cf;color:#062a28}.badge.p{background:#3a2d52;color:#ffd48a}
.hide{display:none!important}
.usage{margin-bottom:14px}
.usage .track{height:12px;border-radius:12px;background:rgba(255,255,255,.1);overflow:hidden}
.usage .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2f92,#ff7a3d)}
.usage p{margin:8px 0 0;color:#b7afbd;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mitem{position:relative;border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;background:#120c1e}
.mitem img,.mitem video{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.mitem .minfo{padding:8px 10px;font-size:12px;color:#cfc7d4;line-height:1.5}
.mitem .minfo b{color:#fff}
.mitem .mchk{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);border-radius:8px;padding:4px 6px;display:flex}
.mitem .mchk input{width:18px;height:18px;padding:0}
.mitem button.del{width:calc(100% - 20px);margin:0 10px 10px}
</style>
</head>
<body>
<div class="card">
  <h1>Freshers' Night — Admin</h1>

  <div id="login">
    <div class="row">
      <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
      <button id="loginBtn">Open</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>

  <div id="panel" class="hide">
    <div class="row">
      <button class="tab on" id="tabReg">Performers</button>
      <button class="tab" id="tabPass">Entry passes</button>
      <button class="tab" id="tabMedia">Photos &amp; reels</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="row">
      <input id="search" placeholder="Search…">
      <button class="ghost" id="refresh">Refresh</button>
      <button id="csv">Download CSV</button>
    </div>
    <div id="mediaView" class="hide">
      <div class="usage"><div class="track"><i id="usageBar"></i></div><p id="usageTxt"></p></div>
      <div class="row"><button class="ghost" id="selAll">Select all</button><button class="del small" id="delSel" style="padding:12px 14px">Delete selected</button></div>
      <div class="mgrid" id="mgrid"></div>
    </div>
    <div class="wrap" id="tableWrap">
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let password = '', view = 'reg', regs = [], passes = [], media = { items: [], used: 0, cap: 0 };
const fmt = (t) => (t ? new Date(t).toLocaleString('en-IN') : '');

function setMsg(t){ $('#msg').textContent = t || ''; }
async function api(path, method, body){
  const res = await fetch(path, {
    method: method || 'GET',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store'
  });
  return res;
}

async function load(){
  setMsg('');
  const [a, b, c] = await Promise.all([api('/names'), api('/pass'), api('/media')]);
  if (a.status === 401 || b.status === 401 || c.status === 401) { setMsg('Wrong password'); return false; }
  if (!a.ok || !b.ok) { setMsg('Could not load. Try again.'); return false; }
  regs = await a.json(); passes = await b.json();
  media = c.ok ? await c.json() : { items: [], used: 0, cap: 0 };
  if (media.ready === false) setMsg('Photo storage (R2) is not connected yet.');
  $('#login').classList.add('hide');
  $('#panel').classList.remove('hide');
  render();
  return true;
}

function stat(k, v){
  const d = document.createElement('div'); d.className = 'stat';
  d.innerHTML = '<b>' + v + '</b>' + k; $('#stats').appendChild(d);
}
function addRow(tb, cells, actions){
  const tr = document.createElement('tr');
  cells.forEach(v => {
    const td = document.createElement('td');
    if (v instanceof Node) td.appendChild(v); else td.textContent = v;
    tr.appendChild(td);
  });
  const td = document.createElement('td'); td.style.whiteSpace = 'nowrap';
  actions.forEach(a => td.appendChild(a)); tr.appendChild(td); tb.appendChild(tr);
}
function btn(label, cls, fn){
  const b = document.createElement('button'); b.className = 'small ' + cls; b.textContent = label;
  b.style.marginRight = '6px'; b.onclick = fn; return b;
}

function fmtSize(n){ return n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.round(n / 1e3) + ' KB'; }

function renderMedia(){
  const items = media.items || [];
  $('#stats').innerHTML = '';
  stat('Files', items.length); stat('Used', fmtSize(media.used || 0)); stat('Limit', fmtSize(media.cap || 0));
  const pct = media.cap ? Math.min(100, (media.used || 0) / media.cap * 100) : 0;
  $('#usageBar').style.width = pct + '%';
  $('#usageTxt').textContent = pct.toFixed(1) + '% of the limit used. When the limit is reached the oldest files are deleted automatically.';
  const g = $('#mgrid'); g.innerHTML = '';
  items.forEach(m => {
    const d = document.createElement('div'); d.className = 'mitem';
    const url = '/media/' + m.key;
    const el = document.createElement(m.kind === 'video' ? 'video' : 'img');
    if (m.kind === 'video') { el.src = url + '#t=0.1'; el.controls = true; el.preload = 'metadata'; el.muted = true; el.playsInline = true; }
    else { el.src = url; el.loading = 'lazy'; el.alt = m.filename || 'photo'; }
    d.appendChild(el);
    const l = document.createElement('label'); l.className = 'mchk';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.dataset.key = m.key; l.appendChild(cb); d.appendChild(l);
    const info = document.createElement('div'); info.className = 'minfo';
    const who = document.createElement('b'); who.textContent = m.by || 'Anonymous';
    info.appendChild(who);
    info.appendChild(document.createTextNode(' · ' + (m.section === 'drive' ? 'Drive' : 'Reels') + ' · ' + fmtSize(m.size)));
    info.appendChild(document.createElement('br'));
    info.appendChild(document.createTextNode(fmt(m.time)));
    d.appendChild(info);
    const b = document.createElement('button'); b.className = 'small del'; b.textContent = 'Delete';
    b.onclick = () => removeMedia([m.key]); d.appendChild(b);
    g.appendChild(d);
  });
}

async function removeMedia(keys){
  if (!keys.length) return;
  if (!confirm('Delete ' + keys.length + ' file' + (keys.length > 1 ? 's' : '') + '?')) return;
  const res = await api('/media', 'DELETE', { keys });
  if (!res.ok) return setMsg('Could not delete.');
  const gone = new Set(keys);
  const freed = media.items.filter(m => gone.has(m.key)).reduce((s, m) => s + m.size, 0);
  media.items = media.items.filter(m => !gone.has(m.key)); media.used = Math.max(0, (media.used || 0) - freed);
  render();
}

function render(){
  const isMedia = view === 'media';
  $('#tableWrap').classList.toggle('hide', isMedia);
  $('#mediaView').classList.toggle('hide', !isMedia);
  $('#csv').classList.toggle('hide', isMedia);
  $('#search').classList.toggle('hide', isMedia);
  if (isMedia) return renderMedia();
  const q = $('#search').value.trim().toLowerCase();
  $('#stats').innerHTML = '';
  const tb = $('#rows'); tb.innerHTML = '';

  if (view === 'reg'){
    const c = (a) => regs.filter(r => r.activity === a).length;
    stat('Total', regs.length); stat('Dance', c('Dance')); stat('Music', c('Music')); stat('Extra', c('Extra'));
    stat('Groups', regs.filter(r => r.mode === 'Group').length);
    $('#head').innerHTML = '<tr><th>#</th><th>Name</th><th>Roll</th><th>Sem</th><th>Phone</th><th>Solo/Group</th><th>Activity</th><th>Team members</th><th>Time</th><th></th></tr>';
    regs.filter(r => !q || [r.name, r.roll, r.phone, r.activity, r.team].join(' ').toLowerCase().includes(q))
      .forEach((r, i) => addRow(tb, [i + 1, r.name, r.roll, r.semester, r.phone, r.mode, r.activity, r.team, fmt(r.time)],
        [btn('Delete', 'del', () => remove('/names', r))]));
  } else {
    const ver = passes.filter(p => p.verified).length;
    stat('Passes', passes.length); stat('Verified', ver); stat('Pending', passes.length - ver);
    $('#head').innerHTML = '<tr><th>#</th><th>Name</th><th>Phone</th><th>Transaction ID</th><th>Status</th><th>Time</th><th></th></tr>';
    passes.filter(p => !q || [p.name, p.phone, p.txn].join(' ').toLowerCase().includes(q))
      .forEach((p, i) => {
        const s = document.createElement('span'); s.className = 'badge ' + (p.verified ? 'v' : 'p'); s.textContent = p.verified ? 'Verified' : 'Pending';
        addRow(tb, [i + 1, p.name, p.phone, p.txn, s, fmt(p.time)], [
          btn(p.verified ? 'Unverify' : 'Verify', p.verified ? 'ghost' : 'ok', () => verify(p)),
          btn('Delete', 'del', () => remove('/pass', p))
        ]);
      });
  }
}

async function remove(path, r){
  if (!confirm('Delete ' + r.name + '?')) return;
  const res = await api(path, 'DELETE', { id: r.id });
  if (!res.ok) return setMsg('Could not delete.');
  if (path === '/names') regs = regs.filter(x => x.id !== r.id); else passes = passes.filter(x => x.id !== r.id);
  render();
}
async function verify(p){
  const res = await api('/pass', 'PUT', { id: p.id, verified: !p.verified });
  if (!res.ok) return setMsg('Could not update.');
  p.verified = !p.verified; render();
}

function cell(v, guard){
  let s = String(v == null ? '' : v);
  if (guard && /^[=+\-@]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function downloadCsv(){
  let head, rows, file;
  if (view === 'reg'){
    head = ['Name', 'Roll', 'Semester', 'Phone', 'Solo/Group', 'Activity', 'Team members', 'Time'];
    rows = regs.map(r => [cell(r.name, 1), cell(r.roll, 1), cell(r.semester), cell(r.phone), cell(r.mode), cell(r.activity), cell(r.team, 1), cell(fmt(r.time))]);
    file = 'freshers-performers.csv';
  } else {
    head = ['Name', 'Phone', 'Transaction ID', 'Status', 'Time'];
    rows = passes.map(p => [cell(p.name, 1), cell(p.phone), cell(p.txn), cell(p.verified ? 'Verified' : 'Pending'), cell(fmt(p.time))]);
    file = 'freshers-passes.csv';
  }
  const lines = [head.map(h => cell(h)).join(','), ...rows.map(r => r.join(','))];
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file;
  document.body.appendChild(a); a.click(); a.remove();
}

function setView(v){
  view = v; $('#tabReg').classList.toggle('on', v === 'reg'); $('#tabPass').classList.toggle('on', v === 'pass'); $('#tabMedia').classList.toggle('on', v === 'media');
  $('#search').value = ''; render();
}
$('#tabReg').onclick = () => setView('reg');
$('#tabPass').onclick = () => setView('pass');
$('#tabMedia').onclick = () => setView('media');
$('#selAll').onclick = () => { const boxes = [...document.querySelectorAll('#mgrid input[type=checkbox]')]; const all = boxes.every(b => b.checked); boxes.forEach(b => b.checked = !all); };
$('#delSel').onclick = () => removeMedia([...document.querySelectorAll('#mgrid input:checked')].map(b => b.dataset.key));
$('#loginBtn').onclick = async () => {
  password = $('#pw').value; if (!password) return;
  if (await load()) { try { sessionStorage.setItem('fn_admin', password); } catch (e) {} }
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });
$('#refresh').onclick = load;
$('#search').oninput = render;
$('#csv').onclick = downloadCsv;
try {
  const saved = sessionStorage.getItem('fn_admin');
  if (saved) { password = saved; load().then(ok => { if (!ok) sessionStorage.removeItem('fn_admin'); }); }
} catch (e) {}
</script>
</body>
</html>
